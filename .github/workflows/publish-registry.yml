name: Publish MCP package and registry entry
# npm's trusted publisher for @dreamworkhq/mcp names this repository and this
# workflow filename, so renaming the file breaks npm publishing until the npm
# package setting is changed to match. It also names the npm-release
# environment, which this repository restricts to mcp-v* tags, so a workflow
# edited on a branch cannot obtain an identity npm accepts.
on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mcp-registry
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    if: github.repository == 'dreamworkhq/mcp' && startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    environment: npm-release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify manifest identity and release
        id: release
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('server.json', 'utf-8'));
          const pkg = JSON.parse(readFileSync('apps/mcp/package.json', 'utf-8'));
          const identity = 'io.github.dreamworkhq/dreamwork';
          if (manifest.name !== identity || pkg.mcpName !== identity) throw new Error('Registry identity mismatch');
          if (pkg.repository?.url !== 'git+https://github.com/dreamworkhq/mcp.git') throw new Error('package.json repository.url must be git+https://github.com/dreamworkhq/mcp.git: npm trusted publishing rejects a package whose repository differs from the publishing repository');
          if (manifest.version !== pkg.version) throw new Error('Registry version differs from the package version');
          const [npmPackage] = manifest.packages ?? [];
          if (manifest.packages?.length !== 1 || npmPackage.registryType !== 'npm' || npmPackage.identifier !== pkg.name || npmPackage.version !== pkg.version) throw new Error('The registry entry must list this npm release');
          if (manifest.remotes?.length !== 1 || manifest.remotes[0].url !== 'https://mcp.dreamworkhq.com/mcp') throw new Error('The registry entry must list the hosted endpoint');
          if (process.env.GITHUB_REF.startsWith('refs/tags/') && process.env.GITHUB_REF !== `refs/tags/mcp-v${pkg.version}`) throw new Error('Tag differs from the package version');
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          JS
      - name: Verify hosted endpoint
        run: |
          curl --fail --silent --show-error https://mcp.dreamworkhq.com/health
          curl --fail --silent --show-error https://mcp.dreamworkhq.com/.well-known/oauth-protected-resource/mcp
      - name: Install verified publisher
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          curl -fsSLo "$archive" "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/$archive"
          printf '%s  %s\n' 'a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc' "$archive" | sha256sum --check
          tar xzf "$archive" mcp-publisher
      - name: Validate manifest
        run: ./mcp-publisher validate
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.23.0
          run_install: false
      # No dependency cache: a release build must not restore files an earlier
      # run saved.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      # npm trusted publishing needs npm >= 11.5.1 and Node 22 ships 10.x. The
      # version is pinned exactly so a release never runs an unreviewed npm.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.19.1
      - run: pnpm build
      # The tarball inlines the contract sources, so only the packed artifact
      # proves that a consumer's install works.
      - run: pnpm test:package
      # No token: npm exchanges this job's GitHub OIDC identity for a
      # short-lived credential and attaches provenance. The step runs only for
      # a release tag, so a dispatch on main can never publish a version that
      # has no tag. A version npm already serves is skipped, so a re-run is safe.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/mcp-v')
        working-directory: apps/mcp
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "@dreamworkhq/mcp@$VERSION" version >/dev/null 2>&1; then
            echo "npm already serves $VERSION; skipping"
          else
            npm publish --access public
          fi
      # The registry accepts the entry only when npm serves this version with a
      # matching mcpName, and npm can answer 404 for a version it has just
      # accepted. `validate` does not check npm, so wait here, bounded, and
      # retry a failed login or publish. An entry the registry already serves is done.
      - name: Publish using GitHub OIDC
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          name=io.github.dreamworkhq/dreamwork
          entry="https://registry.modelcontextprotocol.io/v0/servers/io.github.dreamworkhq%2Fdreamwork/versions/$VERSION"
          for attempt in $(seq 1 20); do
            if curl --fail --silent --output /dev/null "$entry"; then
              echo "The registry serves $name $VERSION"
              exit 0
            fi
            served="$(curl --fail --silent "https://registry.npmjs.org/@dreamworkhq%2Fmcp/$VERSION" | jq -r '.mcpName // empty' || true)"
            if [ "$served" = "$name" ]; then
              if ./mcp-publisher login github-oidc && ./mcp-publisher publish; then
                exit 0
              fi
              echo "Registry login or publish failed on attempt $attempt"
            elif [ -n "$served" ]; then
              echo "::error::npm serves $VERSION with mcpName $served; the registry needs $name"
              exit 1
            else
              echo "npm does not serve $VERSION yet (attempt $attempt)"
            fi
            sleep 30
          done
          echo "::error::could not publish $name $VERSION within 10 minutes"
          exit 1
  # A separate job so the one holding id-token gains no write permission. It
  # runs only after npm and the registry accepted the release, and a re-run
  # rewrites the notes of the release it already created.
  release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node apps/mcp/scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$TAG" --verify-tag --title "Dreamwork MCP ${TAG#mcp-v}" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
